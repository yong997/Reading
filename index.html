<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading · TXT 阅读编辑器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light" data-width="medium">

  <!-- 顶部工具栏 -->
  <header id="toolbar">
    <div class="tb-group tb-brand">
      <button id="btnSidebar" class="tb-btn icon-btn" title="收起/展开目录（Ctrl+B）">☰ 目录</button>
      <span class="logo">Reading</span>
      <button id="btnOpen" class="tb-btn" title="打开本地 txt（支持 GBK/UTF-8）">打开文件</button>
      <button id="btnSave" class="tb-btn primary" title="保存回原文件 (Ctrl+S)" disabled>保存</button>
      <button id="btnSaveAs" class="tb-btn" title="另存为副本（下载）">另存副本</button>
    </div>

    <div class="tb-group">
      <label class="tb-label">编码
        <select id="selEncoding" title="文件编码">
          <option value="auto">自动</option>
          <option value="utf-8">UTF-8</option>
          <option value="gbk">GBK/GB18030</option>
          <option value="big5">Big5</option>
          <option value="utf-16le">UTF-16LE</option>
        </select>
      </label>
    </div>

    <div class="tb-group tb-spacer"></div>

    <div class="tb-group">
      <button id="btnEdit" class="tb-btn" title="切换编辑模式（可直接修改正文）">✎ 编辑</button>
      <span class="tb-label">字号
        <button class="tb-mini" data-font="-1">A−</button>
        <span id="lblFont">19</span>
        <button class="tb-mini" data-font="1">A+</button>
      </span>
      <span class="tb-label">行距
        <button class="tb-mini" data-lh="-1">−</button>
        <button class="tb-mini" data-lh="1">+</button>
      </span>
      <span class="tb-label">主题
        <select id="selTheme">
          <option value="light">日间</option>
          <option value="sepia">护眼</option>
          <option value="dark">夜间</option>
        </select>
      </span>
      <span class="tb-label">页宽
        <select id="selWidth">
          <option value="narrow">窄</option>
          <option value="medium">中</option>
          <option value="wide">宽</option>
        </select>
      </span>
    </div>
  </header>

  <div id="layout">
    <!-- 左侧目录 -->
    <aside id="sidebar">
      <div class="side-head">
        <input id="tocSearch" type="search" placeholder="搜索章节…" autocomplete="off">
        <div id="fileMeta" class="file-meta">尚未打开文件</div>
      </div>
      <ul id="toc"></ul>
    </aside>

    <!-- 正文区 -->
    <main id="viewport">
      <article id="reader">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">📖</div>
          <h2>Reading · TXT 阅读编辑器</h2>
          <p>点击左上角 <b>打开文件</b>，或把 <b>.txt</b> 文件拖到这里。</p>
          <p class="muted">自动识别 GBK / UTF-8 · 自动分章 · 边读边改 · 保存回原文件</p>
          <p class="muted small">建议通过 <code>start.bat</code> 启动（本地服务器）以获得“直接写回原文件”的能力；直接双击 index.html 也可读取和编辑，但保存会改为下载副本。</p>
        </div>

        <div id="chapterView" hidden>
          <h2 id="chapterTitle" class="chapter-title"></h2>
          <div id="chapterBody" class="chapter-body"></div>
          <div id="chapterNav" class="chapter-nav">
            <button id="btnPrev" class="tb-btn">← 上一章</button>
            <span id="navInfo"></span>
            <button id="btnNext" class="tb-btn">下一章 →</button>
          </div>
        </div>
      </article>
    </main>
  </div>

  <!-- 底部状态栏 -->
  <footer id="statusbar">
    <span id="statusLeft">就绪</span>
    <span id="statusRight"></span>
  </footer>

  <!-- 拖拽遮罩 -->
  <div id="dropzone" class="dropzone" hidden><div>松开以打开 TXT 文件</div></div>

  <!-- 右键菜单 -->
  <div id="ctxMenu" class="ctx-menu" hidden></div>

  <input type="file" id="fileInput" accept=".txt,text/plain" hidden>

  <script src="js/gbk-encode.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
